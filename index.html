<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url='https://github.com/ozgurgulsuna'" />
    <title>Redirecting...</title>
    
    <style>
      body {
        /* Dark theme */
        background-color: #121212;
        color: #e0e0e0;
        
        /* Modern, clean font */
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        
        /* Center everything perfectly */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }

      /* Style the link so it pops on the dark background */
      a {
        color: #58a6ff; /* A nice GitHub-style blue */
        text-decoration: none;
        font-weight: bold;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div>
      <h2>Redirecting...</h2>
      <p>If you are not redirected automatically, <a href="https://github.com/ozgurgulsuna">click here</a>.</p>
    </div>
  </body>
</html>
