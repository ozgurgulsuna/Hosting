<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Backcore Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: hidden; }
    canvas { display: block; }
    #ui {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px;
    }
    #ui button {
      padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-family: sans-serif;
      background: rgba(0,0,0,0.55); color: #fff;
      backdrop-filter: blur(6px); transition: background 0.2s;
    }
    #ui button:hover  { background: rgba(0,0,0,0.8); }
    #ui button.hidden { background: rgba(200,60,60,0.7); }
    #speedWrap {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
      padding: 6px 14px; border-radius: 6px; color: #fff;
      font-size: 13px; font-family: sans-serif;
    }
    #speedSlider { width: 100px; accent-color: #fff; cursor: pointer; }
    #eccSlider   { width: 120px; accent-color: #e05050; cursor: pointer; }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader }      from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass }        from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass }        from 'three/addons/postprocessing/SMAAPass.js';

// --- scene ---
const scene = new THREE.Scene();
scene.background = null;


// --- camera parameters ---
const CAM_DIST        = 0.62;  // distance from origin
const CAM_ELEV_DEG    = 45;    // pitch: 0=horizontal, 90=top-down
const CAM_AZIMUTH_DEG = 25;    // horizontal angle
const CAM_ROLL_DEG    = 15;    // roll around view axis
const CAM_FOV         = 35;

const _elev   = CAM_ELEV_DEG    * Math.PI / 180;
const _azim   = CAM_AZIMUTH_DEG * Math.PI / 180;
const rollRad = CAM_ROLL_DEG    * Math.PI / 180;
const _xz     = CAM_DIST * Math.cos(_elev);
const camPersp = new THREE.PerspectiveCamera(CAM_FOV, innerWidth / innerHeight, 0.001, 100);
camPersp.position.set(_xz * Math.sin(_azim), CAM_DIST * Math.sin(_elev), _xz * Math.cos(_azim));
camPersp.up.set(Math.sin(rollRad), Math.cos(rollRad), 0);

const orthoSize = 0.18;
const camOrtho  = new THREE.OrthographicCamera(
  -orthoSize * innerWidth / innerHeight, orthoSize * innerWidth / innerHeight,
   orthoSize, -orthoSize, 0.001, 100
);
camOrtho.position.copy(camPersp.position);
camOrtho.up.copy(camPersp.up);

let camera = camOrtho;

// --- renderer ---
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- post-processing ---
renderer.setClearColor(0x000000, 0);
const renderTarget = new THREE.WebGLRenderTarget(innerWidth * devicePixelRatio, innerHeight * devicePixelRatio, {
  type: THREE.HalfFloatType,
  format: THREE.RGBAFormat,
});
const composer = new EffectComposer(renderer, renderTarget);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const ssaoPass = new GTAOPass(scene, camera, innerWidth, innerHeight);
ssaoPass.output    = GTAOPass.OUTPUT.Default;
ssaoPass.pdSamples = 16;
ssaoPass.enabled   = false;
const aoParams = ssaoPass.gtaoMaterial.uniforms;
aoParams['radius'          ].value = 0.05;
aoParams['distanceExponent'].value = 1.5;
aoParams['thickness'       ].value = 1.0;
aoParams['scale'           ].value = 1.5;
composer.addPass(ssaoPass);

composer.addPass(new OutputPass());
composer.addPass(new SMAAPass(innerWidth * devicePixelRatio, innerHeight * devicePixelRatio));

// --- lights ---
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;

// soft neutral ambient
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);

// front-left key â€” gentle, slightly warm
const key = new THREE.DirectionalLight(0xfff8f0, 0.9);
key.position.set(-1, 1.5, 2);
scene.add(key);

// front-right fill â€” same strength, slightly cool for balance
const fill = new THREE.DirectionalLight(0xf0f4ff, 0.9);
fill.position.set(1, 1, 2);
scene.add(fill);

// soft back rim â€” separates model from background
const rim = new THREE.DirectionalLight(0xffffff, 0.4);
rim.position.set(0, -1, -2);
scene.add(rim);

// --- orbit controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.05;
controls.maxDistance = 1.0;
controls.target.set(0, 0, 0);

// --- group structure ---
// spinGroup rotates around motor axis (world Y after tilt)
// tiltGroup tilts 90Â° so the disc face is visible
let rotor1Ref = null, rotor2Ref = null, statorRef = null, stator2Ref = null, windingsRef = null;
let scaleRef = 1, statorBaseX = 0, statorBaseY = 0, stator2BaseX = 0, stator2BaseY = 0;
let eccMode = 'dynamic';  // 'static' | 'dynamic'
let eccMM   = 1.5;
// spinGroup â†’ tiltGroup : rotors spin + tilt
const spinGroup = new THREE.Group();
const tiltGroup = new THREE.Group();
tiltGroup.rotation.x = Math.PI / 2;
spinGroup.add(tiltGroup);
scene.add(spinGroup);

// staticTiltGroup : stator tilts but does NOT spin
const staticTiltGroup = new THREE.Group();
staticTiltGroup.rotation.x = Math.PI / 2;
scene.add(staticTiltGroup);
let ready = false;

function prepareRotor(root) {
  root.traverse((obj) => {
    if (obj.name === 'magnetFixture') obj.visible = false;
    if (obj.name === 'magnetTemplate' && obj.isMesh) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => m.color.setRGB(0.08, 0.08, 0.08));
    }
    if (obj.isMesh && obj.parent?.name.startsWith('PZ_Countersunk_flat_head_screw')) {
      const applyGray = m => { m.color.setRGB(0.99, 0.99, 0.99); m.metalness = 0.5; m.roughness = 0.4; m.needsUpdate = true; };
      if (Array.isArray(obj.material)) obj.material.forEach(applyGray);
      else applyGray(obj.material);
    }
  });
  return root;
}

// --- load both GLTFs in parallel ---
const loader = new GLTFLoader();
const loadGLTF = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));

Promise.all([
  loadGLTF('backCore_colored.gltf'),
  loadGLTF('cycloidalDisc.gltf'),
  loadGLTF('centerCore.gltf')
]).then(([bcGltf, discGltf, windGltf]) => {

  // --- rotors ---
  const rotor1 = prepareRotor(bcGltf.scene);
  const rotor2 = prepareRotor(bcGltf.scene.clone(true));

  const box    = new THREE.Box3().setFromObject(rotor1);
  const centre = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const sc     = 0.15 / Math.max(size.x, size.y, size.z);

  // Motor axis XY = magnet ring centroid; fall back to full bbox centre if no magnet_* materials.
  const axisBox = new THREE.Box3();
  rotor1.traverse(obj => {
    if (obj.isMesh) {
      const m = Array.isArray(obj.material) ? obj.material[0] : obj.material;
      if (m?.name?.startsWith('magnet_')) axisBox.expandByObject(obj);
    }
  });
  const axis = axisBox.isEmpty() ? centre.clone() : axisBox.getCenter(new THREE.Vector3());

  // Position: XY from motor axis, Z from full bbox centre
  rotor1.position.set(-sc * axis.x, -sc * axis.y, -sc * centre.z);
  rotor1.scale.setScalar(sc);
  rotor1.updateMatrixWorld(true);

  const mBox = new THREE.Box3();
  rotor1.traverse(obj => {
    if (obj.isMesh) {
      const m = Array.isArray(obj.material) ? obj.material[0] : obj.material;
      if (m?.name?.startsWith('magnet_')) mBox.expandByObject(obj);
    }
  });
  const r1BoxFromMagnets = !mBox.isEmpty();
  const rotor1Box = r1BoxFromMagnets ? mBox : new THREE.Box3().setFromObject(rotor1);
  // With magnets present, pick the face farther from origin (magnet face). Without magnets,
  // the bbox is symmetric around 0 â€” pick min.z so the stator-facing surface ends up at the air gap.
  const faceZ = r1BoxFromMagnets
    ? (Math.abs(rotor1Box.min.z) > Math.abs(rotor1Box.max.z) ? rotor1Box.min.z : rotor1Box.max.z)
    : rotor1Box.min.z;
  const AIRGAP = -0.0081 * sc;  // 8.1 mm real distance between rotor faces (sc converts real m â†’ world units)

  rotor1.position.z += -AIRGAP / 2 - faceZ;

  rotor2.position.set(-sc * axis.x, -sc * axis.y, sc * centre.z); // Z flipped for mirror
  rotor2.scale.set(sc, sc, -sc);
  rotor2.rotation.z = Math.PI;  // top rotor initial 180Â° offset
  rotor2.updateMatrixWorld(true);

  const mBox2 = new THREE.Box3();
  rotor2.traverse(obj => {
    if (obj.isMesh) {
      const m = Array.isArray(obj.material) ? obj.material[0] : obj.material;
      if (m?.name?.startsWith('magnet_')) mBox2.expandByObject(obj);
    }
  });
  const r2BoxFromMagnets = !mBox2.isEmpty();
  const rotor2Box = r2BoxFromMagnets ? mBox2 : new THREE.Box3().setFromObject(rotor2);
  const faceZ2 = r2BoxFromMagnets
    ? (Math.abs(rotor2Box.max.z) > Math.abs(rotor2Box.min.z) ? rotor2Box.max.z : rotor2Box.min.z)
    : rotor2Box.max.z;
  rotor2.position.z += AIRGAP / 2 - faceZ2;

  // --- stator discs (double-stator topology: two cycloidal discs, 180Â° phase) ---
  const stator = discGltf.scene;
  const discBoxR  = new THREE.Box3().setFromObject(stator);
  const discCentR = discBoxR.getCenter(new THREE.Vector3());
  const discSizeR = discBoxR.getSize(new THREE.Vector3());

  // X/Y origin = centre of the discHub node (so eccentricity orbits about the bearing centre,
  // not the off-centre full-mesh bbox). Z stays on bbox centre for axial placement.
  const hubCent = new THREE.Vector3();
  let hubFound = false;
  stator.traverse(obj => {
    if (obj.name === 'discHub') {
      new THREE.Box3().setFromObject(obj).getCenter(hubCent);
      hubFound = true;
    }
  });
  if (!hubFound) hubCent.copy(discCentR);  // fallback

  // disc #1 â€” native orientation, mirror on Z is done via the second clone
  stator.position.set(-sc * hubCent.x, -sc * hubCent.y, -sc * discCentR.z);
  stator.scale.setScalar(sc);

  // disc #2 â€” clone, Z-mirror so it presents its mating face the other way
  const stator2 = stator.clone(true);
  stator2.position.set(-sc * hubCent.x, -sc * hubCent.y, sc * discCentR.z);
  stator2.scale.set(sc, sc, -sc);
  stator2.rotation.z = (1) * Math.PI * 2/2;  // top disc initial phase offset

  // axial separation between the two discs along the local motor axis (Z)
  const DISC_GAP = sc * discSizeR.z + 0.001;
  stator.position.z  +=  DISC_GAP / 2;
  stator2.position.z += -DISC_GAP / 2;

  scaleRef     = sc;
  statorBaseX  = stator.position.x;
  statorBaseY  = stator.position.y;
  stator2BaseX = stator2.position.x;
  stator2BaseY = stator2.position.y;

  // --- center core (single piece) ---
  const centerCore = windGltf.scene;
  const ccBoxR  = new THREE.Box3().setFromObject(centerCore);
  const ccCentR = ccBoxR.getCenter(new THREE.Vector3());
  centerCore.position.set(-sc * ccCentR.x, -sc * ccCentR.y, -sc * ccCentR.z);
  centerCore.scale.setScalar(sc);

  const windingsGroup = new THREE.Group();
  windingsGroup.add(centerCore);


  rotor1Ref   = rotor1;
  rotor2Ref   = rotor2;
  statorRef   = stator;
  stator2Ref  = stator2;
  windingsRef = windingsGroup;
  tiltGroup.add(rotor1);
  tiltGroup.add(rotor2);
  staticTiltGroup.add(stator);
  staticTiltGroup.add(stator2);
  staticTiltGroup.add(windingsGroup);  // centerCore is stationary

  windingsRef.visible = true;

  ready = true;
  document.title = 'Motor Viewer';

}).catch(err => console.error('Load error', err));

// --- speed ---
let rotSpeed = 0.060;
let camFollow = false;

// --- speed keys work even when iframe has focus ---
const speedMap = {'0':0, '1':0.004, '2':0.010, '3':0.020, '4':0.045, '5':0.085};
window.addEventListener('keydown', e => {
  if (e.key in speedMap) rotSpeed = speedMap[e.key];
});

// --- postMessage API (for embed control) ---
let rafId = null;
function pauseRender()  { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } }
function resumeRender() { if (rafId === null) animate(); }

window.addEventListener('message', e => {
  const d = e.data;
  if (d && d.type === 'rotate:speed') {
    rotSpeed = d.value;
  } else if (d && d.type === 'pause') {
    pauseRender();
  } else if (d && d.type === 'resume') {
    resumeRender();
  } else if (d === 'rotate:on') {
    rotSpeed = 0.012;
  } else if (d === 'rotate:off') {
    rotSpeed = 0;
  }
});

// --- animate ---
function animate() {
  rafId = requestAnimationFrame(animate);
  if (ready) {
    spinGroup.rotation.y += rotSpeed;
    if (camFollow) {
      const cos = Math.cos(rotSpeed), sin = Math.sin(rotSpeed);
      // rotate position around Y
      const px = camera.position.x, pz = camera.position.z;
      camera.position.x = px * cos + pz * sin;
      camera.position.z = -px * sin + pz * cos;
      // rotate up vector around Y (needed when camera is on the Y axis)
      const ux = camera.up.x, uz = camera.up.z;
      camera.up.x = ux * cos + uz * sin;
      camera.up.z = -ux * sin + uz * cos;
      camera.lookAt(controls.target);
      controls.update();
    }
    if (eccMode === 'dynamic' && statorRef) {
      const r = eccMM * 0.001 * scaleRef;
      const a = spinGroup.rotation.y;
      statorRef.position.x = statorBaseX - r * Math.cos(a);
      statorRef.position.y = statorBaseY + r * Math.sin(a);
      if (stator2Ref) {
        stator2Ref.position.x = stator2BaseX + r * Math.cos(a);
        stator2Ref.position.y = stator2BaseY - r * Math.sin(a);
      }
    }
  }
  controls.update();
  renderPass.camera = camera;
  ssaoPass.camera = camera;
  composer.render();
}
animate();

// --- resize ---
window.addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  camPersp.aspect = aspect;
  camPersp.updateProjectionMatrix();
  camOrtho.left   = -orthoSize * aspect;
  camOrtho.right  =  orthoSize * aspect;
  camOrtho.top    =  orthoSize;
  camOrtho.bottom = -orthoSize;
  camOrtho.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderTarget.setSize(innerWidth * devicePixelRatio, innerHeight * devicePixelRatio);
  composer.setSize(innerWidth, innerHeight);
  ssaoPass.setSize(innerWidth, innerHeight);
  applyEmbedViewOffset();
});
// --- rotor toggle buttons ---
const ui = document.createElement('div');
ui.id = 'ui';
ui.innerHTML = `
  <button id="btnR1">Hide Rotor 1</button>
  <button id="btnS">Hide Stator</button>
  <button id="btnW">Hide Windings</button>
  <button id="btnR2">Hide Rotor 2</button>
  <div id="speedWrap">
    <span>Speed</span>
    <input id="speedSlider" type="range" min="0" max="50" step="0.1" value="12">
    <span id="speedVal">12.0&times;</span>
  </div>
  <div id="speedWrap">
    <span>Eccentricity</span>
    <input id="eccSlider" type="range" min="0" max="15" step="0.1" value="1.5">
    <span id="eccVal">1.5 mm</span>
  </div>
  <button id="btnEccMode">Dynamic</button>
  <div id="speedWrap">
    <span>Stator opacity</span>
    <input id="opacitySlider" type="range" min="0" max="1" step="0.01" value="1">
  </div>
  <button id="btnCam">Perspective</button>
  <button id="btnCamFollow">Cam Follow</button>
  <button id="btnAO">AO On</button>
`;
document.body.appendChild(ui);

// Hide UI when embedded (url has ?embed or inside an iframe)
const isEmbed = new URLSearchParams(location.search).has('embed');
if (isEmbed) ui.style.display = 'none';

// --- embed view offset (shift right + zoom, orbit center unchanged) ---
const EMBED_ZOOM        = 0.55;   // zoom-in factor  (1 = no zoom, 2 = 2× zoom)
const EMBED_SHIFT_RIGHT = -0.12;  // fraction of screen width  to shift right (+right, -left)
const EMBED_SHIFT_DOWN  = -0.21;   // fraction of screen height to shift down  (+down,  -up)

function applyEmbedViewOffset() {
  if (!isEmbed) return;
  const W = innerWidth, H = innerHeight;
  const fw = W / EMBED_ZOOM, fh = H / EMBED_ZOOM;
  const ox = -EMBED_SHIFT_RIGHT * fw;
  const oy = -EMBED_SHIFT_DOWN  * fh;
  camPersp.setViewOffset(fw, fh, ox, oy, W, H);
  camOrtho.setViewOffset(fw, fh, ox, oy, W, H);
}
applyEmbedViewOffset();

const slider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
slider.addEventListener('input', () => {
  rotSpeed = parseFloat(slider.value) * 0.005;
  speedVal.textContent = parseFloat(slider.value).toFixed(1) + '×';
});

function makeToggle(btnId, getRotor) {
  document.getElementById(btnId).addEventListener('click', function() {
    const r = getRotor();
    if (!r) return;
    r.visible = !r.visible;
    this.textContent = r.visible ? this.textContent.replace('Show','Hide') : this.textContent.replace('Hide','Show');
    this.classList.toggle('hidden', !r.visible);
  });
}

makeToggle('btnR1', () => rotor1Ref);
makeToggle('btnR2', () => rotor2Ref);
makeToggle('btnW',  () => windingsRef);

// Stator toggle drives both discs together
document.getElementById('btnS').addEventListener('click', function () {
  if (!statorRef) return;
  const nextVisible = !statorRef.visible;
  statorRef.visible = nextVisible;
  if (stator2Ref) stator2Ref.visible = nextVisible;
  this.textContent = nextVisible ? this.textContent.replace('Show','Hide') : this.textContent.replace('Hide','Show');
  this.classList.toggle('hidden', !nextVisible);
});

document.getElementById('opacitySlider').addEventListener('input', function () {
  if (!statorRef) return;
  const v = parseFloat(this.value);
  const apply = (root) => root.traverse(obj => {
    if (obj.isMesh) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => { m.transparent = v < 1; m.opacity = v; });
    }
  });
  apply(statorRef);
  if (stator2Ref) apply(stator2Ref);
});

document.getElementById('btnAO').addEventListener('click', function () {
  ssaoPass.enabled = !ssaoPass.enabled;
  this.textContent = ssaoPass.enabled ? 'AO Off' : 'AO On';
  this.classList.toggle('hidden', ssaoPass.enabled);
});

document.getElementById('btnCamFollow').addEventListener('click', function () {
  camFollow = !camFollow;
  this.textContent = camFollow ? 'Cam Free' : 'Cam Follow';
  this.classList.toggle('hidden', camFollow);
  controls.enabled = !camFollow;
  if (!camFollow) camera.up.set(Math.sin(rollRad), Math.cos(rollRad), 0);
  if (camFollow) {
    // reposition camera to look at the rotation centre from the side
    const dist = camera.position.distanceTo(controls.target);
    camera.position.set(0, dist, 0);
    camera.up.set(0, 0, -1);
    controls.target.set(0, 0, 0);
    camera.lookAt(0, 0, 0);
    controls.update();
  }
});

document.getElementById('btnCam').addEventListener('click', function () {
  const toOrtho = camera === camPersp;
  if (toOrtho) {
    // copy persp position/target to ortho
    camOrtho.position.copy(camPersp.position);
    camOrtho.quaternion.copy(camPersp.quaternion);
  } else {
    camPersp.position.copy(camOrtho.position);
    camPersp.quaternion.copy(camOrtho.quaternion);
  }
  camera = toOrtho ? camOrtho : camPersp;
  controls.object = camera;
  controls.update();
  this.textContent = toOrtho ? 'Perspective' : 'Orthographic';
});

const eccSlider  = document.getElementById('eccSlider');
const eccVal     = document.getElementById('eccVal');
const btnEccMode = document.getElementById('btnEccMode');

eccSlider.addEventListener('input', () => {
  eccMM = parseFloat(eccSlider.value);
  eccVal.textContent = eccMM.toFixed(1) + ' mm';
  if (eccMode === 'static' && statorRef) {
    const e = eccMM * 0.001 * scaleRef;
    statorRef.position.x  = statorBaseX  - e;
    if (stator2Ref) stator2Ref.position.x = stator2BaseX + e;
  }
});

btnEccMode.addEventListener('click', function () {
  eccMode = eccMode === 'static' ? 'dynamic' : 'static';
  this.textContent = eccMode === 'static' ? 'Dynamic' : 'Static';
  this.classList.toggle('hidden', eccMode === 'dynamic');
  if (eccMode === 'static' && statorRef) {
    const e = eccMM * 0.001 * scaleRef;
    statorRef.position.y = statorBaseY;
    statorRef.position.x = statorBaseX - e;
    if (stator2Ref) {
      stator2Ref.position.y = stator2BaseY;
      stator2Ref.position.x = stator2BaseX + e;
    }
  }
});
</script>
</body>
</html>
