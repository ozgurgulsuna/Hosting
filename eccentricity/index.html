<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #222; overflow: hidden; }

/* ── deck ── */
#deck {
  position: relative; width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
}

/* ── slide wrapper (16:9) ── */
.slide {
  display: none;
  position: absolute;
  width:  min(100vw, calc(100vh * 16/9));
  height: min(100vh, calc(100vw * 9/16));
  box-shadow: 0 4px 32px rgba(0,0,0,0.6);
  overflow: hidden;
}
.slide.active { display: block; }

/* slide image fills the wrapper exactly */
.slide img.page {
  width: 100%; height: 100%;
  object-fit: fill;
  display: block;
  pointer-events: none;
  user-select: none;
}

/* ── overlay layer (for future glTF iframes) ── */
.slide .overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.slide .overlay > * { pointer-events: auto; }

/* ── nav pill ── */
#nav {
  position: fixed; bottom: 1.5%; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; z-index: 100;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
  padding: 5px 16px; border-radius: 20px; color: #fff;
  font-family: sans-serif; font-size: 13px; user-select: none;
}
#nav button {
  background: none; border: 1px solid rgba(255,255,255,0.35);
  color: #fff; cursor: pointer; border-radius: 5px;
  padding: 3px 11px; font-size: 13px; transition: background 0.15s;
}
#nav button:hover { background: rgba(255,255,255,0.2); }
#slideNum { min-width: 55px; text-align: center; }

/* ── progress bar ── */
#progress {
  position: fixed; bottom: 0; left: 0; height: 3px;
  background: #215caf; transition: width 0.2s; z-index: 200;
}
</style>
</head>

  <span id="slideNum">1 / 21</span>
  <button id="btnNext">&#8594;</button>
</div>
<div id="progress"></div>

<script>
const slides = document.querySelectorAll('.slide');
const total  = slides.length;
let cur = 0;

function show(idx) {
  slides[cur].classList.remove('active');
  cur = (idx + total) % total;
  slides[cur].classList.add('active');
  document.getElementById('slideNum').textContent = (cur+1) + ' / ' + total;
  document.getElementById('progress').style.width = ((cur+1)/total*100) + '%';
}

document.getElementById('btnNext').addEventListener('click', () => show(cur+1));
document.getElementById('btnPrev').addEventListener('click', () => show(cur-1));

// glTF speed control — sends to all glTF iframes
function setSpeed(speed) {
  ['gltfFrame','speFrame','dpeFrame','explodedFrame'].forEach(id => {
    const fr = document.getElementById(id);
    if (fr) fr.contentWindow.postMessage({ type: 'rotate:speed', value: speed }, '*');
  });
}

document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' '].includes(e.key)) { e.preventDefault(); show(cur+1); }
  if (['ArrowLeft','ArrowUp'].includes(e.key))        { e.preventDefault(); show(cur-1); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End')  show(total-1);
  // speed keys: 0 = stop, 1–5 = increasing speed
  if (e.key === '0') setSpeed(0);
  if (e.key === '1') setSpeed(0.004);
  if (e.key === '2') setSpeed(0.010);
  if (e.key === '3') setSpeed(0.020);
  if (e.key === '4') setSpeed(0.035);
  if (e.key === '5') setSpeed(0.055);
});

let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
document.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 40) show(dx < 0 ? cur+1 : cur-1);
});

document.getElementById('progress').style.width = (1/total*100) + '%';

// keep focus on parent page so keyboard always works
window.focus();
document.addEventListener('click', () => window.focus());
// reclaim focus whenever iframe is clicked
document.getElementById('gltfFrame').addEventListener('load', () => {
  window.focus();
});
</script>
