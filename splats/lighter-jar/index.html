<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lighter Jar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: hidden; height: 100%; }
    canvas { display: block; touch-action: none; }
    #ui {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center;
    }
    #ui button {
      padding: 7px 16px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-family: sans-serif; white-space: nowrap;
      background: rgba(0,0,0,0.55); color: #fff;
      backdrop-filter: blur(6px); transition: background 0.2s;
    }
    #ui button:hover { background: rgba(0,0,0,0.8); }
    #ui button.active { background: rgba(33,92,175,0.85); }
    #load {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(260px, 70vw); text-align: center;
      font-size: 13px; font-family: sans-serif; color: #fff;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
      padding: 12px 16px; border-radius: 6px;
    }
    #bar { height: 3px; margin-top: 8px; background: rgba(255,255,255,0.25); border-radius: 2px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #fff; transition: width 0.2s; }
  </style>
</head>
<body>
<div id="load"><span id="loadtext">Loading 3D scan…</span><div id="bar"><div id="fill"></div></div></div>
<div id="ui">
  <button id="reset">Reset view</button>
  <button id="orbit" class="active">Auto-orbit</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

// Gaussian-splat scan of a glass jar of lighters (phone video -> COLMAP -> FastGS trained with masks,
// jar only, 50.6k Gaussians, SPZ). The splat is in COLMAP's frame; this moves the jar's centre to the
// origin with the table normal as +Y (table plane fitted around the jar's base in the unmasked run; the
// cameras' mean up is ~14 degrees off it).
const SPLAT  = 'lighter-jar.spz';
const CENTER = [0.24987764971351148, 2.379541772139821, 2.03661413286726];
const UP     = [-0.14427080868975664, -0.8942454196818257, -0.42368745926458456];
const RADIUS = 1.0067983390028594;   // model units per scene unit (jar ~1 scene unit across)

// --- camera parameters ---
const CAM_DIST        = 3.5;
const CAM_ELEV_DEG    = 22;
const CAM_AZIMUTH_DEG = 45;
const CAM_TARGET      = new THREE.Vector3(0, 0, 0);
const CAM_FOV         = 55;

const HALF_WIDTH = 1.2;   // half the jar's width in scene units, with margin (fit it on narrow / portrait screens)
const camPos = () => {
  const e = CAM_ELEV_DEG * Math.PI / 180, a = CAM_AZIMUTH_DEG * Math.PI / 180;
  const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(CAM_FOV) / 2) * innerWidth / innerHeight);
  const d = Math.max(CAM_DIST, HALF_WIDTH / Math.tan(hfov / 2) + 1.0);
  return new THREE.Vector3(
    CAM_TARGET.x + d * Math.cos(e) * Math.sin(a),
    CAM_TARGET.y + d * Math.sin(e),
    CAM_TARGET.z + d * Math.cos(e) * Math.cos(a));
};

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;
scene.add(new SparkRenderer({ renderer }));

const camera = new THREE.PerspectiveCamera(CAM_FOV, innerWidth / innerHeight, 0.01, 200);
camera.position.copy(camPos());

// filmed all the way round, from the table up: free orbit, but not from underneath
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minPolarAngle = 0.15;    controls.maxPolarAngle = 1.75;
controls.minDistance = 1.0;       controls.maxDistance = 12;
controls.target.copy(CAM_TARGET);
controls.update();

const splat = new SplatMesh({
  url: SPLAT,
  onProgress: e => {
    if (!e.total) return;
    document.getElementById('fill').style.width = (100 * e.loaded / e.total).toFixed(0) + '%';
    document.getElementById('loadtext').textContent =
      `Loading 3D scan: ${(e.loaded / 1e6).toFixed(1)} / ${(e.total / 1e6).toFixed(1)} MB`;
  },
});
{
  const R = new THREE.Matrix4().makeRotationFromQuaternion(
    new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(...UP).normalize(), new THREE.Vector3(0, 1, 0)));
  const T = new THREE.Matrix4().makeTranslation(-CENTER[0], -CENTER[1], -CENTER[2]);
  const s = 1 / RADIUS;
  new THREE.Matrix4().makeScale(s, s, s).multiply(R).multiply(T)
    .decompose(splat.position, splat.quaternion, splat.scale);
}
scene.add(splat);
let waitingForPixels = false, readyAt = 0;   // after parsing, the first sort + GPU upload still takes a moment: keep the loader up
splat.initialized.then(() => {
  readyAt = performance.now();
  document.getElementById('loadtext').textContent = 'Preparing view…';
  document.getElementById('fill').style.width = '100%';
  waitingForPixels = true;
})
  .catch(() => { document.getElementById('loadtext').textContent = 'Could not load the 3D scan.'; });

// --- UI ---
document.getElementById('reset').onclick = () => {
  camera.position.copy(camPos()); controls.target.copy(CAM_TARGET); controls.update();
};
const orbitBtn = document.getElementById('orbit');
orbitBtn.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  orbitBtn.classList.toggle('active', controls.autoRotate);
};
controls.addEventListener('start', () => {
  if (controls.autoRotate) { controls.autoRotate = false; orbitBtn.classList.remove('active'); }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  if (waitingForPixels && renderer.info.render.frame % 10 === 0) {   // hide the loader once the splat is on screen
    const gl = renderer.getContext(), S = 64, px = new Uint8Array(S * S * 4);   // a patch, not one pixel: the glass is see-through
    gl.readPixels((gl.drawingBufferWidth - S) >> 1, (gl.drawingBufferHeight - S) >> 1, S, S, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let any = false;
    for (let i = 3; i < px.length; i += 4) if (px[i] > 0) { any = true; break; }
    if (any || performance.now() - readyAt > 15000) { waitingForPixels = false; document.getElementById('load').hidden = true; }
  }
});
</script>
</body>
</html>
